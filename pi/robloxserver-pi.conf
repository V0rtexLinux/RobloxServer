# ---------------------------------------------------------------------------
# RobloxServer - configuracao do Raspberry Pi Zero 2W (gateway)
# Edite e rode:  sudo ./install.sh
# ---------------------------------------------------------------------------

# IP fixo do Raspberry Pi na sua rede (configure no roteador / dhcpcd / NetworkManager).
PI_IP="192.168.1.2"

# Interface de rede do Pi (Zero 2W = wlan0).
PI_INTERFACE="wlan0"

# Onde o site ASP.NET roda:
#   remote = num PC Windows com IIS (recomendado, o Pi so encaminha)
#   local  = no proprio Pi, com Mono + fastcgi-mono-server4 + nginx (mais lento, 512 MB de RAM)
SITE_MODE="remote"

# (remote) IP e porta do PC com o IIS
SITE_HOST="192.168.1.10"
SITE_PORT="80"

# (local) pasta onde o repositorio RobloxServer.Web sera publicado no Pi
SITE_DIR="/var/www/robloxserver"

# Porta HTTP que o Pi escuta (os clientes 2015 falam com http://www.roblox.com na porta 80)
HTTP_PORT="80"

# Servidores de jogo (PCs que hospedam pelo launcher). Um por item, separados por espaco:
#   porta_externa:ip_do_pc[:porta_interna]
# O Roblox usa UDP. Ex.: "53640:192.168.1.10 53641:192.168.1.11:53640"
GAME_FORWARDS="53640:192.168.1.10"
GAME_PROTOCOLS="udp"

# DNS local (dnsmasq): aponta os dominios do Roblox 2015 para o Pi, entao os PCs da rede
# nao precisam de Fiddler nem de arquivo hosts. Configure o DNS do roteador (DHCP) para o PI_IP.
DNS_ENABLED="yes"
DNS_HOSTS="roblox.com www.roblox.com api.roblox.com assetgame.roblox.com web.roblox.com clientsettings.api.roblox.com setup.roblox.com"
DNS_UPSTREAM="1.1.1.1 8.8.8.8"

# Abre as portas no roteador via UPnP (miniupnpc), renovando a cada 30 minutos.
# Se o roteador nao tiver UPnP, crie o port forwarding manualmente para o PI_IP.
UPNP_ENABLED="yes"

# DNS dinamico opcional (ex.: DuckDNS). Deixe vazio para desativar.
# Ex.: DDNS_URL="https://www.duckdns.org/update?domains=meuroblox&token=SEU_TOKEN&ip="
DDNS_URL=""
